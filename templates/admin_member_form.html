{% extends "base.html" %}
{% block title %}{{ 'Edit' if member else 'Add' }} Member | Admin{% endblock %}
{% block content %}
<section class="form-card">
    <h2>{{ 'Edit Member' if member else 'Add New Member' }}</h2>
    <form method="POST">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" required
               value="{{ member['full_name'] if member else '' }}">

        {% if not member %}
        <label for="member_no">Member No. (used as login username)</label>
        <input type="text" id="member_no" name="member_no" required>
        {% endif %}

        <label for="department">Department</label>
        <input type="text" id="department" name="department"
               value="{{ member['department'] if member else '' }}">

        <label for="level">Level</label>
        <input type="text" id="level" name="level"
               value="{{ member['level'] if member else '' }}">

        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               value="{{ member['email'] if member else '' }}">

        <label for="phone">Phone</label>
        <input type="text" id="phone" name="phone"
               value="{{ member['phone'] if member else '' }}">

        {% if not member %}
        <label for="password">Initial Password (default: member123)</label>
        <input type="text" id="password" name="password" placeholder="member123">
        {% endif %}

        <button type="submit" class="btn-primary full-width">{{ 'Save Changes' if member else 'Add Member' }}</button>
    </form>
</section>
{% endblock %}
